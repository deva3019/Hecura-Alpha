<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HECURA | Student Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hecura: { dark: '#0a0118', purple: '#5b21b6', neon: '#a78bfa' }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .cyber-grid {
            background-image: linear-gradient(to right, rgba(124, 58, 237, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(124, 58, 237, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        /* Custom Checkbox Design */
        .cyber-checkbox {
            appearance: none;
            background-color: rgba(0,0,0,0.5);
            border: 1px solid #4c1d95;
            width: 1.25rem;
            height: 1.25rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cyber-checkbox:checked {
            background-color: #7c3aed;
            border-color: #a78bfa;
            box-shadow: 0 0 10px #7c3aed;
        }
        .cyber-checkbox:checked::after {
            content: '✓';
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-hecura-dark text-white font-rajdhani min-h-screen relative pb-20">

    <div class="fixed inset-0 cyber-grid pointer-events-none z-0"></div>

    <nav class="relative z-20 bg-black/50 border-b border-purple-900/50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="dashboard.html" class="flex items-center gap-2 text-gray-400 hover:text-white transition">
                <i class="fas fa-arrow-left"></i> <span class="font-orbitron">BACK TO DASHBOARD</span>
            </a>
            <div class="text-right">
                <div class="text-xs text-purple-400 uppercase tracking-widest">Active Terminal</div>
                <div id="topLaptopId" class="font-bold font-orbitron text-xl text-hecura-neon">--</div>
            </div>
        </div>
    </nav>

    <main class="relative z-10 max-w-5xl mx-auto px-6 py-8">
        
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-4xl font-orbitron font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-400">
                NEW REGISTRATION
            </h1>
            <div class="bg-gray-900 border border-purple-500 rounded-xl p-4 shadow-[0_0_20px_rgba(124,58,237,0.3)] text-center min-w-[200px]">
                <div class="text-xs text-gray-500 uppercase tracking-widest mb-1">Assigned ID</div>
                <div id="displayId" class="text-3xl font-mono font-bold text-white tracking-widest animate-pulse">GENERATING...</div>
            </div>
        </div>

        <form id="regForm" class="space-y-8">
            
            <div class="bg-gray-900/60 border border-gray-800 rounded-2xl p-6 backdrop-blur-sm">
                <h3 class="text-xl font-orbitron font-bold text-purple-400 mb-6 border-b border-gray-800 pb-2">
                    <i class="fas fa-user-circle mr-2"></i> CANDIDATE DETAILS
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-gray-400 text-sm font-bold mb-2">FULL NAME</label>
                        <input type="text" id="sName" class="w-full bg-black/50 border border-gray-700 text-white p-3 rounded hover:border-purple-500 focus:border-purple-500 focus:outline-none focus:ring-1 focus:ring-purple-500 transition" placeholder="Enter student name" required>
                    </div>

                    <div>
                        <label class="block text-gray-400 text-sm font-bold mb-2">COLLEGE NAME</label>
                        <input type="text" id="sCollege" class="w-full bg-black/50 border border-gray-700 text-white p-3 rounded hover:border-purple-500 focus:border-purple-500 focus:outline-none focus:ring-1 focus:ring-purple-500 transition" placeholder="Enter college name" required>
                    </div>

                    <div>
                        <label class="block text-gray-400 text-sm font-bold mb-2">PHONE NUMBER</label>
                        <input type="tel" id="sPhone" class="w-full bg-black/50 border border-gray-700 text-white p-3 rounded hover:border-purple-500 focus:border-purple-500 focus:outline-none focus:ring-1 focus:ring-purple-500 transition" placeholder="10-digit mobile number" required pattern="[0-9]{10}">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-gray-400 text-sm font-bold mb-2">MODE</label>
                            <select id="sMode" onchange="updateFee()" class="w-full bg-black/50 border border-gray-700 text-white p-3 rounded hover:border-purple-500 focus:border-purple-500 focus:outline-none transition">
                                <option value="On-Spot">On-Spot</option>
                                <option value="Online">Online</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-400 text-sm font-bold mb-2">FEE (₹)</label>
                            <input type="text" id="sFee" class="w-full bg-gray-800/50 border border-gray-700 text-green-400 font-bold p-3 rounded cursor-not-allowed" value="250" readonly>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-gray-900/60 border border-gray-800 rounded-2xl p-6 backdrop-blur-sm">
                <h3 class="text-xl font-orbitron font-bold text-blue-400 mb-6 border-b border-gray-800 pb-2">
                    <i class="fas fa-gamepad mr-2"></i> EVENT REGISTRATION
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    
                    <div class="bg-blue-900/10 p-4 rounded-xl border border-blue-900/30">
                        <div class="flex justify-between items-center mb-4">
                            <h4 class="font-bold text-blue-300">TECHNICAL</h4>
                            <label class="text-xs text-gray-400 flex items-center gap-1 cursor-pointer hover:text-white">
                                <input type="checkbox" onchange="toggleAll(this, 'tech-event')" class="cyber-checkbox w-4 h-4"> Select All
                            </label>
                        </div>
                        <div class="space-y-3">
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="Frontend Jam" class="cyber-checkbox tech-event">
                                <span class="text-sm">Frontend Jam (Vibe)</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="Tech Clash" class="cyber-checkbox tech-event">
                                <span class="text-sm">Tech Clash</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="Prompt to Pixel" class="cyber-checkbox tech-event">
                                <span class="text-sm">Prompt to Pixel</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="Ideathon" class="cyber-checkbox tech-event">
                                <span class="text-sm">Ideathon</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="Project Presentation" class="cyber-checkbox tech-event">
                                <span class="text-sm">Project Presentation</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="Mind Relay" class="cyber-checkbox tech-event">
                                <span class="text-sm">Mind Relay</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="Brand-Craft" class="cyber-checkbox tech-event">
                                <span class="text-sm">Brand-Craft</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="Blind Code" class="cyber-checkbox tech-event">
                                <span class="text-sm">Blind Code</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="Speed-Keys" class="cyber-checkbox tech-event">
                                <span class="text-sm">Speed-Keys</span>
                            </label>
                        </div>
                    </div>

                    <div class="bg-pink-900/10 p-4 rounded-xl border border-pink-900/30">
                        <div class="flex justify-between items-center mb-4">
                            <h4 class="font-bold text-pink-300">NON-TECHNICAL</h4>
                            <label class="text-xs text-gray-400 flex items-center gap-1 cursor-pointer hover:text-white">
                                <input type="checkbox" onchange="toggleAll(this, 'nontech-event')" class="cyber-checkbox w-4 h-4"> Select All
                            </label>
                        </div>
                        <div class="space-y-3">
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="Fake-it" class="cyber-checkbox nontech-event">
                                <span class="text-sm">Fake-it</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="Meme-Forge" class="cyber-checkbox nontech-event">
                                <span class="text-sm">Meme-Forge</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="Silent Signals" class="cyber-checkbox nontech-event">
                                <span class="text-sm">Silent Signals</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="Frame the Moment" class="cyber-checkbox nontech-event">
                                <span class="text-sm">Frame the Moment</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="Connexion" class="cyber-checkbox nontech-event">
                                <span class="text-sm">Connexion</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="Sticker on Forehead" class="cyber-checkbox nontech-event">
                                <span class="text-sm">Sticker on Forehead</span>
                            </label>
                        </div>
                    </div>

                    <div class="bg-purple-900/10 p-4 rounded-xl border border-purple-900/30">
                        <div class="flex justify-between items-center mb-4">
                            <h4 class="font-bold text-purple-300">FLAGSHIP</h4>
                            <label class="text-xs text-gray-400 flex items-center gap-1 cursor-pointer hover:text-white">
                                <input type="checkbox" onchange="toggleAll(this, 'flag-event')" class="cyber-checkbox w-4 h-4"> Select All
                            </label>
                        </div>
                        <div class="space-y-3">
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="Free Fire" class="cyber-checkbox flag-event">
                                <span class="text-sm">Free Fire</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="BGMI" class="cyber-checkbox flag-event">
                                <span class="text-sm">BGMI</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer hover:bg-white/5 p-2 rounded transition">
                                <input type="checkbox" name="events" value="Chess" class="cyber-checkbox flag-event">
                                <span class="text-sm">Chess</span>
                            </label>
                        </div>
                    </div>

                </div>
            </div>

            <button type="submit" class="w-full py-4 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white font-bold text-xl rounded-xl shadow-[0_0_20px_rgba(124,58,237,0.5)] transform hover:scale-[1.01] transition-all duration-200 font-orbitron tracking-widest">
                CONFIRM REGISTRATION
            </button>

        </form>

    </main>

    <script src="js/auth.js"></script>
    <script src="js/idGenerator.js"></script> <script src="js/registration.js"></script>
</body>
</html>
