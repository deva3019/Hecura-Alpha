<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HECURA | Local Master Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hecura: { dark: '#05010a', purple: '#6d28d9', neon: '#d8b4fe', success: '#00ff9d' }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        .cyber-grid {
            background-image: linear-gradient(to right, rgba(109, 40, 217, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(109, 40, 217, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .glass-panel {
            background: rgba(10, 5, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #05010a; }
        ::-webkit-scrollbar-thumb { background: #4c1d95; border-radius: 3px; }
    </style>
</head>
<body class="bg-hecura-dark text-white font-rajdhani min-h-screen relative flex flex-col overflow-hidden">

    <div class="fixed inset-0 cyber-grid pointer-events-none z-0"></div>

    <nav class="relative z-20 bg-black/60 border-b border-purple-900/50 backdrop-blur-md sticky top-0">
        <div class="max-w-[98%] mx-auto px-6 h-16 flex justify-between items-center">
            <div class="flex items-center gap-6">
                <a href="dashboard.html" class="flex items-center gap-2 text-gray-500 hover:text-white transition group">
                    <i class="fas fa-chevron-left group-hover:-translate-x-1 transition"></i> <span class="font-orbitron text-sm">BACK</span>
                </a>
                <div class="h-8 w-px bg-gray-700"></div>
                <h1 class="text-xl font-orbitron font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-400">
                    LOCAL REGISTRY
                </h1>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="hidden md:flex gap-6 text-xs font-mono text-gray-400">
                    <div>TTL: <span id="navTotal" class="text-white font-bold">0</span></div>
                    <div>$$$: <span id="navMoney" class="text-green-400 font-bold">₹0</span></div>
                </div>
                <div class="text-right border-l border-gray-700 pl-6">
                    <div class="text-[9px] text-gray-500 uppercase tracking-widest">TERMINAL ID</div>
                    <div id="topLaptopId" class="font-bold font-orbitron text-lg text-hecura-neon leading-none">--</div>
                </div>
            </div>
        </div>
    </nav>

    <div class="relative z-10 max-w-[98%] mx-auto px-6 py-4 w-full grid grid-cols-1 lg:grid-cols-12 gap-4">
        
        <div class="lg:col-span-8 glass-panel p-3 rounded-lg flex flex-col md:flex-row gap-3 items-center">
            <div class="relative w-full md:w-1/3">
                <i class="fas fa-search absolute left-3 top-3 text-gray-600 text-xs"></i>
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Find ID / Name..." class="w-full bg-black/40 border border-gray-700 text-white pl-8 pr-3 py-2 rounded text-sm focus:outline-none focus:border-purple-500 transition font-mono">
            </div>

            <div class="flex gap-2 w-full md:w-auto overflow-x-auto">
                <select id="modeFilter" onchange="filterTable()" class="bg-black/40 border border-gray-700 text-gray-300 text-xs py-2 px-3 rounded focus:outline-none focus:border-purple-500">
                    <option value="all">All Modes</option>
                    <option value="Online">Online</option>
                    <option value="On-Spot">On-Spot</option>
                </select>

                <select id="eventFilter" onchange="filterTable()" class="bg-black/40 border border-gray-700 text-gray-300 text-xs py-2 px-3 rounded focus:outline-none focus:border-purple-500 w-40">
                    <option value="all">All Events</option>
                    </select>
            </div>
        </div>

        <div class="lg:col-span-4 flex gap-2">
            <button onclick="exportToExcel()" class="flex-1 flex flex-col items-center justify-center bg-green-900/10 hover:bg-green-900/30 border border-green-900/30 text-green-500 rounded-lg transition group">
                <i class="fas fa-file-excel text-lg mb-1 group-hover:scale-110 transition"></i>
                <span class="text-[10px] font-bold uppercase">Excel List</span>
            </button>
            
            <button onclick="exportJSON()" class="flex-[2] flex items-center justify-center gap-3 bg-gradient-to-r from-purple-700 to-blue-700 hover:from-purple-600 hover:to-blue-600 text-white rounded-lg shadow-lg transition transform hover:scale-[1.01]">
                <i class="fas fa-database animate-pulse-slow"></i>
                <div class="text-left">
                    <div class="text-xs font-bold font-orbitron tracking-widest">EXPORT JSON</div>
                    <div class="text-[9px] text-blue-200 opacity-80">SEND TO MERGE ADMIN (L5)</div>
                </div>
            </button>
        </div>
    </div>

    <main class="relative z-10 max-w-[98%] mx-auto px-6 pb-6 w-full flex-grow overflow-hidden flex flex-col">
        <div class="glass-panel rounded-xl flex-grow overflow-hidden flex flex-col shadow-2xl relative">
            
            <div class="overflow-auto table-container flex-grow">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-black/80 text-gray-500 text-[10px] uppercase tracking-wider sticky top-0 z-10 backdrop-blur-md font-mono">
                        <tr>
                            <th class="p-3 border-b border-gray-800 text-purple-400">ID</th>
                            <th class="p-3 border-b border-gray-800">Candidate Name</th>
                            <th class="p-3 border-b border-gray-800">College</th>
                            <th class="p-3 border-b border-gray-800">Phone</th>
                            <th class="p-3 border-b border-gray-800">Payment</th>
                            <th class="p-3 border-b border-gray-800 w-1/3">Events</th>
                            <th class="p-3 border-b border-gray-800 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="masterTableBody" class="text-sm divide-y divide-gray-800/50 font-rajdhani">
                        </tbody>
                </table>
            </div>

            <div class="p-3 border-t border-gray-800 bg-black/60 text-[10px] text-gray-500 flex justify-between items-center font-mono">
                <div class="flex gap-4">
                    <span>Records: <span id="recordCount" class="text-white">0</span></span>
                    <span>Filtered: <span id="filteredCount" class="text-white">0</span></span>
                </div>
                <div class="flex gap-4">
                     <span class="text-pink-400">On-Spot: <span id="countSpot">0</span></span>
                     <span class="text-blue-400">Online: <span id="countOnline">0</span></span>
                </div>
            </div>
        </div>
    </main>

    <div id="editModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center">
        <div class="bg-[#0f0a1e] border border-purple-500/30 p-6 rounded-xl w-full max-w-md shadow-2xl transform transition-all scale-95" id="editModalContent">
            <h3 class="text-xl font-orbitron font-bold text-white mb-4 border-b border-gray-800 pb-2">EDIT RECORD</h3>
            
            <form id="editForm" class="space-y-4">
                <input type="hidden" id="editId">
                
                <div>
                    <label class="text-xs text-gray-500 uppercase font-bold">Name</label>
                    <input type="text" id="editName" class="w-full bg-black border border-gray-700 rounded p-2 text-white focus:border-purple-500 focus:outline-none">
                </div>
                
                <div>
                    <label class="text-xs text-gray-500 uppercase font-bold">College</label>
                    <input type="text" id="editCollege" class="w-full bg-black border border-gray-700 rounded p-2 text-white focus:border-purple-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-gray-500 uppercase font-bold">Phone</label>
                        <input type="text" id="editPhone" class="w-full bg-black border border-gray-700 rounded p-2 text-white focus:border-purple-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 uppercase font-bold">Mode</label>
                        <select id="editMode" class="w-full bg-black border border-gray-700 rounded p-2 text-white focus:border-purple-500 focus:outline-none">
                            <option value="On-Spot">On-Spot</option>
                            <option value="Online">Online</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="closeEditModal()" class="flex-1 py-2 bg-gray-800 text-gray-400 rounded hover:bg-gray-700 transition text-sm font-bold">CANCEL</button>
                    <button type="submit" class="flex-1 py-2 bg-purple-600 text-white rounded hover:bg-purple-500 transition text-sm font-bold shadow-[0_0_15px_rgba(124,58,237,0.4)]">SAVE CHANGES</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/overall.js"></script>
</body>
</html>
